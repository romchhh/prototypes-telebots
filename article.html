<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стаття — Портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e11d2e;
  --ink:#0c0c0e;
  --muted:#5c5c66;
  --line:rgba(12,12,14,.1);
  --bg:#f7f5f2;
  --bg-deep:#ebe7e1;
  --paper:#fffcf8;
  --glow:rgba(225,29,46,.12);
  --font-display:"Instrument Serif",Georgia,serif;
  --font-body:"Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f4f2ee; --muted:#9a9aa3; --line:rgba(244,242,238,.12);
    --bg:#0e0e10; --bg-deep:#16161a; --paper:#151519; --glow:rgba(225,29,46,.18);
  }
}
:root[data-theme="dark"]{
  --ink:#f4f2ee; --muted:#9a9aa3; --line:rgba(244,242,238,.12);
  --bg:#0e0e10; --bg-deep:#16161a; --paper:#151519; --glow:rgba(225,29,46,.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 80% -5%, var(--glow), transparent 55%),
    radial-gradient(ellipse 50% 35% at 0% 30%, rgba(12,12,14,.04), transparent 50%);
}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;height:auto;}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px;position:relative;z-index:1;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 28px;
}
.brand{
  font-family:var(--font-display);
  font-size:clamp(28px,3.5vw,40px);
  line-height:1;letter-spacing:-.02em;
}
.brand span{color:var(--red);}
.top-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);
  display:grid;place-items:center;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn .icon-sun{display:none;}
:root[data-theme="dark"] .icon-btn .icon-moon{display:none;}
:root[data-theme="dark"] .icon-btn .icon-sun{display:block;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .icon-btn .icon-moon{display:none;}
  :root:not([data-theme="light"]) .icon-btn .icon-sun{display:block;}
}
.lang{
  display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:700;
}
.lang a{padding:10px 12px;color:var(--muted);}
.lang a.active{background:var(--ink);color:var(--bg);}

.article-shell{padding:28px 0 64px;animation:rise .65s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

.back{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--muted);margin-bottom:22px;
}
.back:hover{color:var(--red);}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600;}
.crumbs b{color:var(--red);}

.badge{
  display:inline-block;background:var(--red);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border-radius:2px;margin-bottom:16px;
}

.article-title{
  font-family:var(--font-display);
  font-size:clamp(34px,5.5vw,62px);
  line-height:1.05;letter-spacing:-.025em;font-weight:400;
  max-width:920px;margin-bottom:18px;
}
.article-lead{
  font-size:clamp(17px,2vw,21px);
  color:var(--muted);max-width:720px;line-height:1.45;margin-bottom:22px;
}
.topmeta{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:28px;
  font-size:13px;font-weight:600;color:var(--muted);
}
.translate{color:var(--red);font-weight:800;cursor:pointer;}

.hero-photo{
  width:100%;aspect-ratio:16/8;border-radius:4px;overflow:hidden;
  margin-bottom:14px;background:var(--bg-deep);
}
.hero-photo img{width:100%;height:100%;object-fit:cover;}
.hero-caption{
  font-size:13px;color:var(--muted);margin-bottom:34px;max-width:820px;
}

.layout{
  display:grid;grid-template-columns:minmax(0,720px) minmax(0,1fr);
  gap:48px;align-items:start;
}
.article-body{font-size:18.5px;line-height:1.75;}
.article-body p{margin-bottom:22px;}
.article-body blockquote{
  border-left:3px solid var(--red);
  padding:6px 0 6px 22px;margin:30px 0;
  font-family:var(--font-display);font-size:26px;line-height:1.25;
  color:var(--ink);font-style:italic;
}
.article-body ul{margin:0 0 22px 22px;}
.article-body li{margin-bottom:10px;}
.pull-img{
  margin:32px 0;border-radius:4px;overflow:hidden;
}
.pull-img img{width:100%;aspect-ratio:16/10;object-fit:cover;}
.pull-img figcaption{font-size:12.5px;color:var(--muted);padding-top:8px;}

.author-box{
  display:flex;align-items:center;gap:14px;
  margin:34px 0 22px;padding:18px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.author-box img{width:52px;height:52px;border-radius:50%;object-fit:cover;}
.author-box strong{display:block;font-size:15px;}
.author-box span{font-size:12.5px;color:var(--muted);}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.tag{
  border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--muted);font-weight:600;
}
.tag:hover{color:var(--red);border-color:var(--red);}

.share{display:flex;gap:10px;margin-bottom:8px;}
.share-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;
}
.share-btn:hover{border-color:var(--red);color:var(--red);}

.aside-card{
  position:sticky;top:88px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:22px;
}
.aside-card h3{
  font-family:var(--font-display);font-size:24px;font-weight:400;margin-bottom:16px;
}
.aside-item{
  display:grid;grid-template-columns:88px 1fr;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.aside-item:last-child{border-bottom:none;}
.aside-item img{width:88px;height:68px;object-fit:cover;border-radius:3px;}
.aside-item strong{
  font-family:var(--font-display);font-size:17px;line-height:1.2;font-weight:400;
  display:block;margin-top:4px;
}
.aside-item span{font-size:12px;color:var(--muted);font-weight:700;}

.more{margin-top:64px;}
.more h2{
  font-family:var(--font-display);font-size:clamp(28px,3vw,38px);
  font-weight:400;margin-bottom:22px;
}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.more-card{display:block;transition:transform .25s;}
.more-card:hover{transform:translateY(-4px);}
.more-card .media{aspect-ratio:16/10;overflow:hidden;border-radius:4px;margin-bottom:12px;}
.more-card img{width:100%;height:100%;object-fit:cover;transition:transform .7s;}
.more-card:hover img{transform:scale(1.05);}
.more-card h3{
  font-family:var(--font-display);font-size:22px;line-height:1.18;font-weight:400;margin:8px 0;
}
.meta-line{font-size:13px;font-weight:600;color:var(--muted);}
.meta-line .rubric{color:var(--red);font-weight:800;}

.missing{
  max-width:640px;margin:80px auto;text-align:center;padding:40px 20px;
}
.missing h1{font-family:var(--font-display);font-size:42px;font-weight:400;margin-bottom:12px;}
.missing p{color:var(--muted);margin-bottom:22px;}
.missing a{
  display:inline-flex;background:var(--red);color:#fff;
  padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;
}

footer{
  padding:40px 0 28px;border-top:1px solid var(--line);position:relative;z-index:1;
}
.footer-bottom{text-align:center;font-size:12px;color:var(--muted);}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  .aside-card{position:static;}
  .more-grid{grid-template-columns:1fr 1fr;}
  .hero-photo{aspect-ratio:16/10;}
}
@media (max-width:640px){
  .wrap,.topbar .wrap{padding-left:16px;padding-right:16px;}
  .more-grid{grid-template-columns:1fr;}
  .article-body{font-size:17px;}
  .article-body blockquote{font-size:22px;}
}
</style>
</head>

<script>
(function(){
  try{
    var saved = localStorage.getItem('portal-theme');
    if(saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  var btn = document.getElementById('themeToggle');
  if(btn){
    btn.addEventListener('click', function(){
      var current = document.documentElement.getAttribute('data-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effectiveDark = current ? current === 'dark' : prefersDark;
      var next = effectiveDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('portal-theme', next); }catch(e){}
    });
  }
})();

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
  });
}

function renderBody(list){
  return list.map(function(p){
    if(typeof p === 'object' && p.img){
      return '<figure class="pull-img"><img src="'+esc(p.img)+'" alt=""><figcaption>'+esc(p.cap||'')+'</figcaption></figure>';
    }
    if(String(p).charAt(0) === '«') return '<blockquote>'+esc(p)+'</blockquote>';
    return '<p>'+esc(p)+'</p>';
  }).join('');
}

function renderArticle(id, a){
  var moreKeys = Object.keys(ARTICLES).filter(function(k){ return k !== id; }).slice(0, 3);
  var asideKeys = Object.keys(ARTICLES).filter(function(k){ return k !== id; }).slice(3, 7);

  var aside = asideKeys.map(function(k){
    var m = ARTICLES[k];
    return '<a class="aside-item" href="article.html?id='+esc(k)+'">'+
      '<img src="'+esc(m.image)+'" alt="">'+
      '<div><span>'+esc(m.rubric)+'</span><strong>'+esc(m.title)+'</strong></div></a>';
  }).join('');

  var more = moreKeys.map(function(k){
    var m = ARTICLES[k];
    return '<a class="more-card" href="article.html?id='+esc(k)+'">'+
      '<div class="media"><img src="'+esc(m.image)+'" alt=""></div>'+
      '<div class="meta-line"><span class="rubric">'+esc(m.rubric)+'</span> · '+esc(m.meta)+'</div>'+
      '<h3>'+esc(m.title)+'</h3></a>';
  }).join('');

  return ''+
    '<a class="back" href="news.html">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>'+
      'До головної</a>'+
    '<div class="crumbs"><b>'+esc(a.type)+'</b> → '+esc(a.rubric)+'</div>'+
    (a.badge ? '<div class="badge">В фокусі</div>' : '')+
    '<h1 class="article-title">'+esc(a.title)+'</h1>'+
    '<p class="article-lead">'+esc(a.lead)+'</p>'+
    '<div class="topmeta"><span>'+esc(a.meta)+'</span><span class="translate" id="translateSwitch">Читать на русском</span></div>'+
    '<div class="hero-photo"><img src="'+esc(a.image)+'" alt=""></div>'+
    '<div class="hero-caption">'+esc(a.caption)+'</div>'+
    '<div class="layout">'+
      '<div>'+
        '<div class="article-body">'+renderBody(a.body)+'</div>'+
        '<div class="author-box">'+
          '<img src="'+esc(a.avatar)+'" alt="">'+
          '<div><strong>'+esc(a.author)+'</strong><span>'+esc(a.role)+'</span></div>'+
        '</div>'+
        '<div class="tags">'+a.tags.map(function(t){ return '<a class="tag" href="#">#'+esc(t)+'</a>'; }).join('')+'</div>'+
        '<div class="share">'+
          '<button class="share-btn" type="button" aria-label="Facebook"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></button>'+
          '<button class="share-btn" type="button" aria-label="Telegram"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>'+
        '</div>'+
      '</div>'+
      '<aside class="aside-card"><h3>Читайте також</h3>'+aside+'</aside>'+
    '</div>'+
    '<section class="more"><h2>Більше матеріалів</h2><div class="more-grid">'+more+'</div></section>';
}

(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || 'bjudzhet';
  var root = document.getElementById('articleRoot');
  var a = ARTICLES[id];

  if(!a){
    root.innerHTML = '<div class="missing"><h1>Матеріал не знайдено</h1><p>Цієї новини немає в прототипі.</p><a href="news.html">На головну</a></div>';
    document.title = 'Не знайдено — Портал';
    return;
  }

  document.title = a.title + ' — Портал';
  root.innerHTML = renderArticle(id, a);

  var tr = document.getElementById('translateSwitch');
  if(tr){
    tr.addEventListener('click', function(){
      this.textContent = this.textContent.indexOf('русском') > -1 ? 'Читати українською' : 'Читать на русском';
    });
  }
})();
</script>
